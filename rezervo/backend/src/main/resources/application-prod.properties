# ============================================================
# Setari pentru PRODUCTIE (activate cu SPRING_PROFILES_ACTIVE=prod).
# Toate valorile secrete vin din variabile de mediu, NU din Git.
# Fara valori implicite: daca lipseste ceva, aplicatia refuza sa porneasca.
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
