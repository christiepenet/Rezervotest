# ============================================================
# Setari pentru rularea LOCALA (pe calculatorul tau).
# In productie se suprascriu din application-prod.properties
# si din variabilele de mediu setate pe Render.
# ============================================================
spring.application.name=rezervo
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never

# Baza de date locala H2 (un fisier in folderul ./data, nu trebuie instalat nimic)
spring.datasource.url=jdbc:h2:file:./data/rezervo-dev;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Cheia secreta pentru token-uri. Valoarea de mai jos e DOAR pentru dezvoltare locala.
app.jwt.secret=${JWT_SECRET:doar-pentru-dezvoltare-locala-schimba-ma-123456}
app.jwt.ttl-hours=24

# Site-urile care au voie sa apeleze API-ul din browser (separate prin virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

# Cate incercari de login / cont nou are voie un IP in 15 minute
app.ratelimit.auth-attempts-per-15min=10

app.timezone=Europe/Bucharest
